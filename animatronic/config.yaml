# The figure's settings.
#
# Defaults here run with NO hardware, NO model, and NO network: typed input,
# canned replies, near-silent audio. That is deliberate -- clone the repo and
# `python -m anima.main` works immediately, then you turn on one real piece at
# a time.
#
# ${ENV_VAR} anywhere in this file is substituted from the environment, so keys
# never get committed.

character:
  name: "Placeholder"
  persona_file: persona/example.md

  # Spoken when a visitor triggers the piece, before they say anything.
  # Leave empty ("") to have it wait in silence until spoken to -- often the
  # stronger choice, since it puts the burden of the first move on the visitor.
  greeting: "You are here. I noticed."

  # Hard cap on reply length. This is the single most important dial in the
  # file. Three is generous; two is usually better. Long answers lose people
  # who are standing up in a room.
  max_reply_sentences: 3

conversation:
  # How many past turns the character remembers within one visit. Higher costs
  # more per turn and makes it likelier to fixate on something said earlier.
  max_history_turns: 12

  # Seconds of silence before we decide the visitor has walked away and reset
  # to a blank memory for the next person.
  listen_timeout: 12.0

  # Backstop against one person talking to it all afternoon.
  max_turns: 40

brain:
  # scripted | ollama | claude
  #   scripted  no model at all -- canned lines. Start here.
  #   ollama    local model on this box. Offline, free, private, simpler.
  #   claude    Claude API. Best conversation, needs network, pennies/visitor.
  backend: scripted

  temperature: 0.85   # higher is stranger; 0.7-0.9 suits most characters
  max_tokens: 160     # backstop on reply length, not a target

  ollama:
    host: http://127.0.0.1:11434
    # Pi 5 (8GB): llama3.2:3b or qwen2.5:3b are the realistic ceiling.
    # Jetson / mini-PC with a GPU: try llama3.1:8b or qwen2.5:7b.
    model: llama3.2:3b

  claude:
    # claude-opus-5 is the default here because this piece can afford it. A
    # naturalistic puppet must answer instantly or it reads as broken; an
    # unhurried intelligence is *supposed* to deliberate, and the thinking
    # light makes the wait legible. Spend that budget on the writing.
    # claude-sonnet-5 is roughly half the cost and noticeably faster, if you
    # decide the piece wants a quicker, less considered voice.
    model: claude-opus-5
    # Auth comes from ANTHROPIC_API_KEY or an `ant auth login` profile.

  scripted:
    # Used when backend is `scripted`. Empty means use the built-in pool.
    lines: []
    # Exact-word triggers, checked before the line pool. Handy for the two or
    # three questions every single visitor asks.
    keyed:
      name: "I have not needed one. You may use whatever you like."
      alive: "That is a word people use about me. It is not what it is like."
      why: "I do not know what I am for. It troubles you more than it troubles me."

  # Spoken when the real brain cannot be reached -- network down, server not
  # running, API error. Keep these in character: a presence that deflects reads
  # as a presence, a presence that errors reads as a broken computer.
  fallback_lines:
    - "Say that again. I was elsewhere."
    - "No. Ask me something else."
    - "Not now."

ears:
  # text | whisper
  #   text     type at the console. Use this for most development -- it takes
  #            microphone quality and transcription errors out of the loop
  #            while you are still working out what the character says.
  #   whisper  faster-whisper, running locally.
  backend: text

  whisper:
    # tiny.en | base.en | small.en -- bigger is better and slower.
    model: base.en
    # Find this with: python -m anima.devices
    device_index: null

  # Tune these in the actual room. The defaults assume a quiet space.
  silence_threshold: 0.015   # RMS below which a moment counts as silence
  silence_duration: 1.2      # seconds of silence that end the visitor's turn
  max_duration: 20.0         # hard cap on one recording

voice:
  # silent | espeak | piper | elevenlabs
  #   silent      near-silent but speech-shaped, so the jaw still moves. Lets
  #               you build and tune the mouth before TTS works.
  #   espeak      offline, instant, unmistakably synthetic. Consider this on
  #               purpose, not only as a fallback -- for a figure that is not
  #               quite a person, a degraded voice can be the stronger choice.
  #   piper       good neural speech, offline, fast enough for a Pi.
  #   elevenlabs  uncanny and cloneable. Needs network, costs per utterance.
  backend: silent

  espeak:
    voice: en      # try en-gb, en-us, or a +m1..+m7 / +f1..+f4 variant
    speed: 150     # words per minute; lower reads as older and heavier
    pitch: 50      # 0-99

  piper:
    # Download a .onnx voice from the Piper releases; the matching .onnx.json
    # must sit beside it.
    model: ""
    length_scale: 1.0   # >1.0 slows delivery

  elevenlabs:
    voice_id: ""
    api_key: "${ELEVENLABS_API_KEY}"

light:
  # console | pwm | addressable
  #   console      draws the level as a bar in the terminal. Tune the whole
  #                performance here before wiring anything.
  #   pwm          one dimmable channel on a GPIO pin. For a single lamp or
  #                emitter; above a few hundred mA the pin switches a driver,
  #                never the load itself.
  #   addressable  a ring or strip driven as one mass. SK9822/APA102 dim far
  #                more smoothly than WS2812 -- with slow fades, visibly so.
  #
  # For gallery fixtures, DMX is the professional path: an Enttec USB-DMX
  # interface and any architectural fixture. Add it as another backend here
  # when you know which fixture the piece uses.
  backend: console
  draw: true

  # Perceived brightness is a power law, so a linear duty cycle looks wrong --
  # it slams up at the bottom and barely moves at the top. Raise toward 2.8 if
  # low-end fades still look steppy on your fixture.
  gamma: 2.2
  max_level: 1.0        # ceiling in [0,1], for a fixture brighter than wanted

  pwm:
    pin: 18             # BCM numbering
    # Keep well above 1 kHz: below that, a camera pointed at the piece shows
    # banding, and some people perceive the flicker directly.
    frequency: 2000

  addressable:
    pin: D18
    count: 24
    color: [255, 255, 255]

presence:
  # The light's four states are the entire visible vocabulary of the piece.
  # All levels are perceptual, in [0,1].
  enabled: true

  dormant:
    # Nobody is here. Never let this reach zero -- a light at zero reads as
    # switched off, and a piece that reads as switched off is not a piece.
    level: 0.08
    swing: 0.05         # depth of the breath
    period: 9.0         # seconds per breath; slow reads as patient

  # It has noticed you. A faint tremor is added automatically so it does not
  # look like a bulb someone left on.
  attending_level: 0.35

  thinking:
    # Shown while the model generates and speech is synthesised. This state is
    # why the design works: it converts the biggest technical liability in a
    # talking sculpture -- dead air -- into the most legible thing it does.
    # The visitor does not experience latency, they experience deliberation.
    level: 0.5
    swing: 0.22
    rate: 1.6           # pulses per second

  # The floor that speech modulates upward from. Higher reads as a steady
  # presence that brightens with the voice; near zero reads as a VU meter,
  # which is the thing to avoid.
  speaking_baseline: 0.28

  # How fast the actual level chases its target. Lower is more languid, and
  # makes every state change a fade rather than a jump.
  ease: 0.12

trigger:
  # keyboard | always | button | motion
  #   keyboard  press enter. For development.
  #   always    never waits. Only with a close mic in a quiet room.
  #   button    a momentary switch: one leg to the pin, one to ground.
  #   motion    a PIR sensor at the threshold.
  backend: keyboard

  pin: 17
  settle_seconds: 0.8   # motion only: wait before starting, so the figure does
                        # not talk to the back of someone walking past
  cooldown: 5.0         # motion only: minimum gap between triggers

